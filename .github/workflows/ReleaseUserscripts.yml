name: Release userscripts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.config.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          scripts=$(
            find . -name script.json -not -path './node_modules/*' -not -path '*/node_modules/*' -print0 |
              while IFS= read -r -d '' config; do
                directory=$(dirname "$config")
                jq -c --arg directory "$directory" '. + {directory: $directory}' "$config"
              done |
              jq -s -c .
          )
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      matrix:
        script: ${{ fromJSON(needs.prepare.outputs.scripts) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        if: matrix.script.type == 'vite'
      - name: Install dependencies
        if: matrix.script.type == 'vite'
        run: bun install --frozen-lockfile
      - name: Build userscript
        if: matrix.script.type == 'vite'
        working-directory: ${{ matrix.script.directory }}
        run: bun run build
      - name: Prepare source userscript
        if: matrix.script.type == 'source'
        run: mkdir -p release-assets && cp "${{ matrix.script.directory }}/${{ matrix.script.source }}" "release-assets/${{ matrix.script.asset }}"
      - name: Prepare built userscript
        if: matrix.script.type == 'vite'
        run: mkdir -p release-assets && cp "${{ matrix.script.directory }}/dist/${{ matrix.script.output }}" "release-assets/${{ matrix.script.asset }}"
      - name: Upload userscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.script.id }}
          path: release-assets/${{ matrix.script.asset }}

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.user.js
